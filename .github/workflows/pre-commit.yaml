name: pre-commit

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  pre-commit:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run pre-commit
        uses: autowarefoundation/autoware-github-actions/pre-commit@3e1247bc10813cf9f6b9deb4bebb3eff6bb46ed6 # v1.69.0
        with:
          pre-commit-config: .pre-commit-config.yaml
