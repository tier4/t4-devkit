name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-slim
    continue-on-error: true
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check if relevant files have been changed
        uses: dorny/paths-filter@9d7afb8d214ad99e78fbd4247752c4caed2b6e4c # v4
        id: is-changed
        with:
          filters: |
            changes:
              - .github/workflows/build-and-test.yaml
              - pyproject.toml
              - t4_devkit/**
              - tests/**

      - name: Define a cache dependency glob
        if: ${{ steps.is-changed.outputs.changes == 'true'}}
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install the project
        if: ${{ steps.is-changed.outputs.changes == 'true'}}
        run: uv sync

      - name: Run tests
        if: ${{ steps.is-changed.outputs.changes == 'true'}}
        run: uv run pytest --cov-report xml:coverage.xml --cov=t4_devkit

      - name: Run CLIs
        if: ${{ steps.is-changed.outputs.changes == 'true'}}
        run: |
          uv run t4viz scene ./tests/sample/t4dataset -o ./output
          uv run t4viz instance ./tests/sample/t4dataset 90f0c98d1a040d5360847f576c5528f8 -o ./output
          uv run t4viz pointcloud ./tests/sample/t4dataset -o ./output
          uv run t4sanity ./tests/sample/t4dataset

      - name: Get test coverage
        if: ${{ steps.is-changed.outputs.changes == 'true'}} && ${{ matrix.python-version == '3.10' }}
        uses: orgoro/coverage@71cf993a407154ad9d8dd027c88a374b0ed002a9 # v3.3
        continue-on-error: true
        with:
          coverageFile: ./coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.5
          thresholdNew: 0.8
          thresholdModified: 0.8
