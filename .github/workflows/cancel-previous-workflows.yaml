name: cancel-previous-workflows

on:
  pull_request_target:

jobs:
  cancel-previous-workflows:
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@d07a454dad7609a92316b57b23c9ccfd4f59af66 # v0.13.1
        with:
          workflow_id: all
          all_but_latest: true
